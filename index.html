<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー＆ストップウォッチ</title>
  <link rel="icon" href="icon.png">
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
      transition: background-color 0.5s ease;
    }
    input {
      font-size: 2em;
      text-align: center;
      width: 6em;
      margin-bottom: 1em;
    }
    .time-display {
      font-size: 5em;
      margin: 0.5em 0;
    }
    .status {
      font-size: 2em;
      margin-right: 0.5em;
    }
    button {
      font-size: 1.5em;
      margin: 0.5em;
      padding: 0.5em 1em;
    }
  </style>
</head>
<body>
  <input id="timeInput" placeholder="1234" />
  <div class="time-display"><span id="statusIcon">⏸</span><span id="arrow">⬇</span> <span id="timer">00:00</span></div>
  <div>
    <button onclick="startOrPause()" id="pauseBtn">⏸ 一時停止</button>
    <button onclick="reset()">🔄 リセット</button>
  </div>

  <script>
    let timerElement = document.getElementById('timer');
    let arrowElement = document.getElementById('arrow');
    let statusIcon = document.getElementById('statusIcon');
    let pauseBtn = document.getElementById('pauseBtn');
    let inputElement = document.getElementById('timeInput');

    let interval = null;
    let mode = 'timer'; // 'timer' or 'stopwatch'
    let remainingSeconds = 0;
    let stopwatchSeconds = 0;
    let isRunning = false;

    const wakeLock = navigator.wakeLock;
    let wakeLockObj = null;

    async function requestWakeLock() {
      try {
        if (wakeLock) {
          wakeLockObj = await wakeLock.request('screen');
        }
      } catch (err) {
        console.error('WakeLock error:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLockObj) {
        wakeLockObj.release();
        wakeLockObj = null;
      }
    }

    function parseInput(value) {
      if (!/^[0-9]+$/.test(value)) return 0;
      let num = parseInt(value);
      let seconds = 0;
      if (value.length <= 2) {
        seconds = num;
      } else {
        let sec = num % 100;
        let min = Math.floor(num / 100);
        seconds = min * 60 + sec;
      }
      return seconds;
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      if (mode === 'timer') {
        timerElement.textContent = formatTime(remainingSeconds);
        arrowElement.textContent = '⬇';
      } else {
        timerElement.textContent = formatTime(stopwatchSeconds);
        arrowElement.textContent = '⬆';
      }
      statusIcon.textContent = isRunning ? '⏵' : '⏸';
    }

    function saveState() {
      const state = {
        mode,
        remainingSeconds,
        stopwatchSeconds,
        isRunning,
        lastUpdated: Date.now()
      };
      localStorage.setItem('timerAppState', JSON.stringify(state));
    }

    function loadState() {
      const raw = localStorage.getItem('timerAppState');
      if (!raw) return;
      try {
        const state = JSON.parse(raw);
        mode = state.mode;
        remainingSeconds = state.remainingSeconds;
        stopwatchSeconds = state.stopwatchSeconds;
        isRunning = state.isRunning;
        const delta = Math.floor((Date.now() - state.lastUpdated) / 1000);
        if (isRunning) {
          if (mode === 'timer') {
            remainingSeconds -= delta;
            if (remainingSeconds <= 0) {
              mode = 'stopwatch';
              stopwatchSeconds = -remainingSeconds;
              remainingSeconds = 0;
            }
          } else {
            stopwatchSeconds += delta;
          }
        }
        updateDisplay();
        if (isRunning) {
          run();
          requestWakeLock();
        }
      } catch {}
    }

    function run() {
      clearInterval(interval);
      interval = setInterval(() => {
        if (!isRunning) return;
        if (mode === 'timer') {
          remainingSeconds--;
          if (remainingSeconds <= 0) {
            mode = 'stopwatch';
            stopwatchSeconds = 0;
            remainingSeconds = 0;
          }
        } else {
          stopwatchSeconds++;
          if (stopwatchSeconds >= 300) {
            document.body.style.backgroundColor = 'white';
            document.body.style.color = 'black';
          }
        }
        updateDisplay();
        saveState();
      }, 1000);
    }

    function startOrPause() {
      isRunning = !isRunning;
      if (isRunning) {
        run();
        requestWakeLock();
      } else {
        clearInterval(interval);
        releaseWakeLock();
      }
      updateDisplay();
      saveState();
    }

    function reset() {
      clearInterval(interval);
      releaseWakeLock();
      document.body.style.backgroundColor = '#121212';
      document.body.style.color = 'white';
      remainingSeconds = parseInput(inputElement.value);
      stopwatchSeconds = 0;
      mode = 'timer';
      isRunning = true;
      run();
      requestWakeLock();
      updateDisplay();
      saveState();
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        startOrPause();
      }
    });

    loadState();
  </script>
</body>
</html>
