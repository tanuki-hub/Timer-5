<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer & Stopwatch</title>
  <link rel="icon" href="icon.png">
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    input {
      font-size: 2em;
      text-align: center;
      width: 6em;
      margin-bottom: 1em;
    }
    #display {
      font-size: 3em;
      margin: 0.5em;
    }
    button {
      font-size: 1.5em;
      margin: 0.5em;
    }
    #indicator {
      font-size: 2em;
      margin-right: 0.5em;
    }
    .whiteout {
      background-color: white;
      color: black;
    }
  </style>
</head>
<body>
  <div>
    <span id="state-icon">⏸️</span>
    <span id="indicator">⬇️</span>
    <span id="display">00:00</span>
  </div>
  <input id="timeInput" placeholder="0907">
  <div>
    <button id="startBtn">スタート</button>
    <button id="pauseBtn">一時停止</button>
  </div>

  <script>
    const display = document.getElementById("display");
    const timeInput = document.getElementById("timeInput");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const indicator = document.getElementById("indicator");
    const stateIcon = document.getElementById("state-icon");

    let isRunning = false;
    let isPaused = false;
    let mode = "timer"; // or "stopwatch"
    let targetTime = 0;
    let baseTime = 0;
    let pausedAt = null;
    let interval;

    if ('wakeLock' in navigator) {
      let wakeLock = null;
      const requestWakeLock = async () => {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {}
      };
      document.addEventListener("visibilitychange", () => {
        if (wakeLock !== null && document.visibilityState === "visible") {
          requestWakeLock();
        }
      });
      requestWakeLock();
    }

    function saveState() {
      localStorage.setItem("mode", mode);
      localStorage.setItem("isRunning", isRunning);
      localStorage.setItem("targetTime", targetTime);
      localStorage.setItem("baseTime", baseTime);
      localStorage.setItem("pausedAt", pausedAt);
    }

    function loadState() {
      mode = localStorage.getItem("mode") || "timer";
      isRunning = localStorage.getItem("isRunning") === "true";
      targetTime = parseInt(localStorage.getItem("targetTime")) || 0;
      baseTime = parseInt(localStorage.getItem("baseTime")) || 0;
      pausedAt = localStorage.getItem("pausedAt");
      if (pausedAt === "null") pausedAt = null;
      if (isRunning && !pausedAt) {
        startTimer();
      } else {
        updateDisplay();
      }
    }

    function parseInput(input) {
      const num = input.replace(/\D/g, "");
      if (!num) return 0;
      if (num.length <= 2) return parseInt(num);
      const seconds = parseInt(num.slice(-2));
      const minutes = parseInt(num.slice(0, -2));
      return minutes * 60 + seconds;
    }

    function startTimer() {
      clearInterval(interval);
      baseTime = Date.now();
      if (pausedAt) {
        const pausedDuration = Date.now() - parseInt(pausedAt);
        baseTime -= pausedDuration;
        pausedAt = null;
      }
      isPaused = false;
      isRunning = true;
      if (mode === "timer") {
        indicator.textContent = "⬇️";
      } else {
        indicator.textContent = "⬆️";
      }
      stateIcon.textContent = "▶️";
      interval = setInterval(updateDisplay, 200);
      saveState();
    }

    function updateDisplay() {
      const now = Date.now();
      let diff;
      if (mode === "timer") {
        diff = targetTime * 1000 - (now - baseTime);
        if (diff <= 0) {
          mode = "stopwatch";
          baseTime = now;
          indicator.textContent = "⬆️";
          diff = 0;
        }
      } else {
        diff = now - baseTime;
        if (diff >= 5 * 60 * 1000) {
          document.body.classList.add("whiteout");
        }
      }

      const sec = Math.floor(diff / 1000) % 60;
      const min = Math.floor(diff / 60000);
      display.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      saveState();
    }

    function pause() {
      if (!isRunning) return;
      clearInterval(interval);
      isPaused = true;
      pausedAt = Date.now();
      isRunning = false;
      stateIcon.textContent = "⏸️";
      saveState();
    }

    startBtn.onclick = () => {
      if (!isRunning && !pausedAt) {
        targetTime = parseInput(timeInput.value);
        baseTime = Date.now();
        mode = "timer";
      }
      startTimer();
    };

    pauseBtn.onclick = pause;

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (isRunning) pause();
        else startTimer();
      }
    });

    loadState();
  </script>
</body>
</html>
