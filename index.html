<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマーとストップウォッチ</title>
  <link rel="icon" href="icon.png">
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    input {
      font-size: 2em;
      text-align: center;
      width: 6em;
      margin-bottom: 1em;
    }
    .display {
      font-size: 4em;
      margin: 20px;
      display: flex;
      align-items: center;
    }
    .icon {
      margin-right: 10px;
    }
    button {
      font-size: 1.5em;
      margin: 5px;
    }
  </style>
</head>

<body>
  <input type="text" id="timeInput" placeholder="0907">
  <div class="display">
    <span class="icon" id="stateIcon">▶</span>
    <span id="timeDisplay">00:00</span>
  </div>
  <div>
    <button onclick="start()">スタート</button>
    <button onclick="pause()">一時停止</button>
  </div>

  <script>
    let timerStart = null;
    let stopwatchStart = null;
    let pauseTime = null;
    let duration = 0;
    let paused = false;
    let inTimer = true;
    let interval;

    function parseInput(input) {
      const num = parseInt(input, 10);
      if (isNaN(num)) return 0;
      const str = num.toString();
      if (str.length <= 2) return num;
      const sec = parseInt(str.slice(-2));
      const min = parseInt(str.slice(0, -2));
      return min * 60 + sec;
    }

    function start() {
      const input = document.getElementById("timeInput").value;
      if (!paused) {
        duration = parseInput(input);
        timerStart = Date.now();
        inTimer = true;
      } else {
        if (inTimer) timerStart += Date.now() - pauseTime;
        else stopwatchStart += Date.now() - pauseTime;
      }
      paused = false;
      startWakeLock();
      clearInterval(interval);
      interval = setInterval(updateTime, 100);
    }

    function pause() {
      if (!paused) {
        pauseTime = Date.now();
        paused = true;
        clearInterval(interval);
        stopWakeLock();
        document.getElementById("stateIcon").textContent = "⏸";
      }
    }

    function updateTime() {
      let display = document.getElementById("timeDisplay");
      let icon = document.getElementById("stateIcon");

      if (inTimer) {
        let elapsed = (Date.now() - timerStart) / 1000;
        let remaining = duration - elapsed;
        if (remaining <= 0) {
          inTimer = false;
          stopwatchStart = Date.now();
          icon.textContent = "▲";
        } else {
          icon.textContent = "▼";
          display.textContent = formatTime(remaining);
          document.body.style.backgroundColor = "#121212";
          document.body.style.color = "#ffffff";
          return;
        }
      }

      let swElapsed = (Date.now() - stopwatchStart) / 1000;
      display.textContent = formatTime(swElapsed);
      icon.textContent = "▲";

      if (swElapsed >= 300) {
        document.body.style.backgroundColor = "#ffffff";
        document.body.style.color = "#000000";
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (paused) start(); else pause();
      }
    });

    let wakeLock = null;
    async function startWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.error('WakeLock failed:', err);
      }
    }
    function stopWakeLock() {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    }
  </script>
</body>

</html>
