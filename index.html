<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー & ストップウォッチ</title>
  <link rel="icon" href="icon.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      transition: background-color 0.5s;
    }
    input, button {
      margin: 10px;
      padding: 10px;
      font-size: 1.5rem;
      border-radius: 5px;
      border: none;
    }
    #display {
      font-size: 3rem;
      margin-top: 20px;
    }
    .arrow {
      font-size: 2rem;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <h1>タイマー & ストップウォッチ</h1>
  <input type="text" id="timeInput" placeholder="例：312 → 3分12秒" maxlength="4">
  <button onclick="startTimer()">スタート</button>
  <button onclick="togglePause()">一時停止 / 再開</button>
  <div id="display"><span class="arrow" id="arrow">⬇️</span>--:--</div>

  <script>
    let timerId;
    let stopwatchId;
    let stopwatchSeconds = 0;
    let remainingSeconds = 0;
    let paused = false;
    let mode = 'timer'; // 'timer' or 'stopwatch'
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.error('Wake Lock failed:', err);
      }
    }

    function saveState() {
      const state = {
        mode,
        remainingSeconds,
        stopwatchSeconds,
        paused
      };
      localStorage.setItem('timerState', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('timerState');
      if (saved) {
        const state = JSON.parse(saved);
        mode = state.mode;
        remainingSeconds = state.remainingSeconds;
        stopwatchSeconds = state.stopwatchSeconds;
        paused = state.paused;

        if (mode === 'timer' && remainingSeconds > 0) {
          resumeTimer();
        } else if (mode === 'stopwatch') {
          startStopwatch();
        }
      }
    }

    function parseTimeInput(input) {
      const digits = input.replace(/\D/g, '');
      if (digits.length <= 2) {
        return parseInt(digits, 10);
      } else {
        const sec = parseInt(digits.slice(-2), 10);
        const min = parseInt(digits.slice(0, -2), 10);
        return min * 60 + sec;
      }
    }

    function startTimer() {
      clearInterval(timerId);
      clearInterval(stopwatchId);
      document.body.style.backgroundColor = '#121212';
      stopwatchSeconds = 0;
      paused = false;
      mode = 'timer';
      document.getElementById('arrow').textContent = '⬇️';
      
      const input = document.getElementById('timeInput').value;
      remainingSeconds = parseTimeInput(input);

      requestWakeLock();
      runTimer();
    }

    function runTimer() {
      const display = document.getElementById('display');
      timerId = setInterval(() => {
        if (paused) return;

        if (remainingSeconds <= 0) {
          clearInterval(timerId);
          startStopwatch();
          return;
        }

        const m = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
        const s = String(remainingSeconds % 60).padStart(2, '0');
        display.innerHTML = `<span class="arrow" id="arrow">⬇️</span>${m}:${s}`;
        remainingSeconds--;
        saveState();
      }, 1000);
    }

    function resumeTimer() {
      requestWakeLock();
      runTimer();
    }

    function startStopwatch() {
      clearInterval(timerId);
      mode = 'stopwatch';
      document.getElementById('arrow').textContent = '⬆️';
      const display = document.getElementById('display');
      stopwatchId = setInterval(() => {
        if (paused) return;

        stopwatchSeconds++;
        const m = String(Math.floor(stopwatchSeconds / 60)).padStart(2, '0');
        const s = String(stopwatchSeconds % 60).padStart(2, '0');
        display.innerHTML = `<span class="arrow" id="arrow">⬆️</span>${m}:${s}`;

        if (stopwatchSeconds >= 300) {
          document.body.style.backgroundColor = '#ffffff';
          display.style.color = '#000000';
        }
        saveState();
      }, 1000);
    }

    function togglePause() {
      paused = !paused;
      saveState();
    }

    loadState();
  </script>
</body>
</html>
