<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer-5</title>
  <link rel="icon" href="icon.png" />
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
    }
    input {
      font-size: 2em;
      width: 6em;
      text-align: center;
    }
    #timeDisplay {
      font-size: 4em;
      margin-top: 1em;
    }
    #arrow {
      font-size: 2em;
      margin-right: 0.5em;
    }
    .whiteout {
      background-color: white;
      color: black;
    }
    button {
      font-size: 1.2em;
      margin: 1em;
    }
  </style>
</head>
<body>
  <h1>Timer-5</h1>
  <div>
    <input type="text" id="timeInput" placeholder="0907" />
    <button onclick="startTimer()">Start</button>
    <button onclick="togglePause()" id="pauseBtn">Pause</button>
  </div>
  <div id="timeDisplay"><span id="statusIcon">⏸</span><span id="arrow">⬇️</span><span id="time">00:00</span></div>

  <script>
    let startTime, endTime, timerInterval;
    let isRunning = false;
    let isPaused = false;
    let pausedAt = 0;
    let isTimerMode = true;
    let stopwatchStart, stopwatchElapsed = 0;
    let wakeLock = null;

    function parseTime(input) {
      let num = input.replace(/\D/g, "");
      let sec = 0;
      if (num.length <= 2) sec = parseInt(num);
      else if (num.length <= 4) sec = parseInt(num.slice(0, -2)) * 60 + parseInt(num.slice(-2));
      return sec;
    }

    function saveState() {
      localStorage.setItem("timeInput", document.getElementById("timeInput").value);
      localStorage.setItem("isRunning", isRunning);
      localStorage.setItem("isPaused", isPaused);
      localStorage.setItem("pausedAt", pausedAt);
      localStorage.setItem("isTimerMode", isTimerMode);
      localStorage.setItem("startTime", startTime);
      localStorage.setItem("endTime", endTime);
      localStorage.setItem("stopwatchStart", stopwatchStart);
      localStorage.setItem("stopwatchElapsed", stopwatchElapsed);
    }

    function loadState() {
      document.getElementById("timeInput").value = localStorage.getItem("timeInput") || "";
      isRunning = localStorage.getItem("isRunning") === "true";
      isPaused = localStorage.getItem("isPaused") === "true";
      pausedAt = parseFloat(localStorage.getItem("pausedAt")) || 0;
      isTimerMode = localStorage.getItem("isTimerMode") !== "false";
      startTime = parseFloat(localStorage.getItem("startTime")) || 0;
      endTime = parseFloat(localStorage.getItem("endTime")) || 0;
      stopwatchStart = parseFloat(localStorage.getItem("stopwatchStart")) || 0;
      stopwatchElapsed = parseFloat(localStorage.getItem("stopwatchElapsed")) || 0;

      if (isRunning) runTimer();
      else updateDisplay();
    }

    function startTimer() {
      let sec = parseTime(document.getElementById("timeInput").value);
      if (!sec) return;
      isTimerMode = true;
      startTime = Date.now();
      endTime = startTime + sec * 1000;
      isRunning = true;
      isPaused = false;
      pausedAt = 0;
      acquireWakeLock();
      runTimer();
      saveState();
    }

    function runTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        let now = Date.now();
        let remaining;

        if (isPaused) {
          remaining = pausedAt;
        } else if (isTimerMode) {
          remaining = Math.max(0, Math.floor((endTime - now) / 1000));
        } else {
          stopwatchElapsed = Math.floor((now - stopwatchStart) / 1000);
          remaining = stopwatchElapsed;
        }

        let min = String(Math.floor(remaining / 60)).padStart(2, '0');
        let sec = String(remaining % 60).padStart(2, '0');
        document.getElementById("time").textContent = `${min}:${sec}`;
        document.getElementById("arrow").textContent = isTimerMode ? "⬇️" : "⬆️";
        document.getElementById("statusIcon").textContent = isRunning && !isPaused ? "▶️" : "⏸";

        if (isTimerMode && remaining === 0 && !isPaused) {
          isTimerMode = false;
          stopwatchStart = Date.now();
          stopwatchElapsed = 0;
          saveState();
        }

        if (!isTimerMode && remaining >= 300) {
          document.body.classList.add("whiteout");
        }

        saveState();
      }, 250);
    }

    function togglePause() {
      if (!isRunning) return;
      if (isPaused) {
        let now = Date.now();
        if (isTimerMode) {
          endTime = now + pausedAt * 1000;
        } else {
          stopwatchStart = now - pausedAt * 1000;
        }
        isPaused = false;
      } else {
        if (isTimerMode) {
          pausedAt = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
        } else {
          pausedAt = Math.floor((Date.now() - stopwatchStart) / 1000);
        }
        isPaused = true;
      }
      runTimer();
      saveState();
    }

    async function acquireWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.error(`Wake Lock error: ${err.name}, ${err.message}`);
      }
    }

    window.addEventListener("load", loadState);
    window.addEventListener("beforeunload", saveState);
    document.addEventListener("keydown", e => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePause();
      }
    });
  </script>
</body>
</html>
