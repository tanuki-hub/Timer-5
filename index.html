<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer-5</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    input {
      font-size: 2rem;
      width: 6rem;
      text-align: center;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      margin-bottom: 1rem;
    }
    #time {
      font-size: 4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1.5rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #444;
      color: white;
    }
  </style>
</head>

<body>
  <input type="text" id="input" placeholder="0907" />
  <div id="time">
    <span id="mode">▶</span>
    <span id="arrow">↓</span>
    <span id="display">00:00</span>
  </div>
  <button id="pauseBtn">⏸</button>

  <script>
    const input = document.getElementById('input');
    const display = document.getElementById('display');
    const arrow = document.getElementById('arrow');
    const modeIcon = document.getElementById('mode');
    const pauseBtn = document.getElementById('pauseBtn');

    let mode = 'timer';
    let startTime = null;
    let pausedTime = 0;
    let paused = false;
    let targetTime = null;
    let elapsed = 0;
    let interval = null;

    // Prevent sleep
    let wakeLock = null;
    const requestWakeLock = async () => {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    };

    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

    const saveState = () => {
      localStorage.setItem('timer5-state', JSON.stringify({
        mode,
        startTime,
        pausedTime,
        paused,
        targetTime,
        elapsed,
        input: input.value
      }));
    };

    const loadState = () => {
      const data = JSON.parse(localStorage.getItem('timer5-state'));
      if (data) {
        mode = data.mode;
        startTime = data.startTime;
        pausedTime = data.pausedTime;
        paused = data.paused;
        targetTime = data.targetTime;
        elapsed = data.elapsed;
        input.value = data.input;
        update();
      }
    };

    const format = s => {
      const m = Math.floor(s / 60);
      const ss = Math.floor(s % 60);
      return `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    };

    const update = () => {
      if (paused) {
        modeIcon.textContent = '⏸';
      } else {
        modeIcon.textContent = '▶';
      }

      if (mode === 'timer') {
        arrow.textContent = '↓';
        const remaining = Math.max(0, (targetTime - Date.now()) / 1000);
        display.textContent = format(remaining);
        if (!paused && remaining <= 0) {
          mode = 'stopwatch';
          startTime = Date.now();
          saveState();
        }
      } else {
        arrow.textContent = '↑';
        const timePassed = paused ? elapsed : (Date.now() - startTime);
        const seconds = timePassed / 1000;
        display.textContent = format(seconds);
        if (seconds >= 300) {
          document.body.style.backgroundColor = '#fff';
          document.body.style.color = '#000';
        }
      }
    };

    const tick = () => {
      update();
      saveState();
    };

    const start = () => {
      const val = input.value;
      let s = 0;
      if (val.length <= 2) s = parseInt(val);
      else if (val.length === 3) s = parseInt(val[0]) * 60 + parseInt(val.slice(1));
      else if (val.length === 4) s = parseInt(val.slice(0, 2)) * 60 + parseInt(val.slice(2));
      targetTime = Date.now() + s * 1000;
      startTime = Date.now();
      paused = false;
      pausedTime = 0;
      mode = 'timer';
      requestWakeLock();
      clearInterval(interval);
      interval = setInterval(tick, 100);
      update();
    };

    pauseBtn.onclick = () => {
      paused = !paused;
      if (paused) {
        if (mode === 'timer') {
          pausedTime = targetTime - Date.now();
        } else {
          elapsed = Date.now() - startTime;
        }
      } else {
        if (mode === 'timer') {
          targetTime = Date.now() + pausedTime;
        } else {
          startTime = Date.now() - elapsed;
        }
      }
      update();
    };

    input.addEventListener('change', start);
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        pauseBtn.click();
      }
    });

    loadState();
    clearInterval(interval);
    interval = setInterval(tick, 100);
  </script>
</body>

</html>
