<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer-5</title>
  <link rel="icon" href="icon.png" />
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
    }
    input {
      font-size: 2em;
      width: 5em;
      text-align: center;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 0.3em;
      padding: 0.2em 0.5em;
    }
    button {
      font-size: 1em;
      margin: 0.5em;
      padding: 0.5em 1em;
    }
    #timeDisplay {
      font-size: 4em;
      margin: 1em 0;
    }
    .whiteout {
      background-color: #ffffff;
      color: #000000;
    }
  </style>
</head>
<body>
  <h1>Timer-5</h1>
  <div>
    <span id="stateIcon">⏸️</span>
    <span id="arrow">⬇️</span>
    <span id="timeDisplay">00:00</span>
  </div>
  <div>
    <input type="text" id="timeInput" placeholder="1234" maxlength="4" />
  </div>
  <div>
    <button onclick="startTimer()">スタート</button>
    <button onclick="togglePause()">一時停止 / 再開</button>
  </div>
  <script>
    let startTime, targetTime, timerRunning = false, stopwatchRunning = false, paused = false;
    let pauseTime = 0, pauseStart = 0;

    const input = document.getElementById("timeInput");
    const display = document.getElementById("timeDisplay");
    const arrow = document.getElementById("arrow");
    const stateIcon = document.getElementById("stateIcon");

    if ('wakeLock' in navigator) {
      let wakeLock;
      const requestWakeLock = async () => {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {}
      };
      document.addEventListener('visibilitychange', () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });
      requestWakeLock();
    }

    function parseTime(str) {
      const n = parseInt(str);
      if (isNaN(n)) return 0;
      const s = str.length <= 2 ? n : n % 100 + Math.floor(n / 100) * 60;
      return s;
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const ss = s % 60;
      return `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    }

    function updateDisplay() {
      const now = Date.now();
      if (timerRunning && !paused) {
        const remaining = Math.max(0, Math.floor((targetTime - now) / 1000));
        display.textContent = formatTime(remaining);
        if (remaining <= 0) {
          timerRunning = false;
          stopwatchRunning = true;
          startTime = Date.now();
          pauseTime = 0;
          arrow.textContent = '⬆️';
        }
      } else if (stopwatchRunning && !paused) {
        const elapsed = Math.floor((now - startTime - pauseTime) / 1000);
        display.textContent = formatTime(elapsed);
        if (elapsed >= 300) {
          document.body.classList.add("whiteout");
        }
      } else {
        // paused or idle
        if (timerRunning) {
          const remaining = Math.max(0, Math.floor((targetTime - startTime - pauseTime) / 1000));
          display.textContent = formatTime(remaining);
        } else if (stopwatchRunning) {
          const elapsed = Math.floor((now - startTime - pauseTime) / 1000);
          display.textContent = formatTime(elapsed);
        }
      }
      stateIcon.textContent = paused ? '⏸️' : '▶️';
    }

    function startTimer() {
      const seconds = parseTime(input.value);
      if (seconds <= 0) return;
      localStorage.setItem('input', input.value);
      startTime = Date.now();
      targetTime = startTime + seconds * 1000;
      timerRunning = true;
      stopwatchRunning = false;
      paused = false;
      pauseTime = 0;
      document.body.classList.remove("whiteout");
      arrow.textContent = '⬇️';
    }

    function togglePause() {
      if (!timerRunning && !stopwatchRunning) return;
      if (paused) {
        pauseTime += Date.now() - pauseStart;
        paused = false;
      } else {
        pauseStart = Date.now();
        paused = true;
      }
    }

    setInterval(updateDisplay, 250);

    window.addEventListener("keydown", e => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePause();
      }
    });

    // Load state on reload
    window.onload = () => {
      const saved = localStorage.getItem('input');
      if (saved) input.value = saved;
      const seconds = parseTime(saved || "");
      if (seconds > 0) {
        // Keep the last display without starting
        display.textContent = formatTime(seconds);
      }
    };
  </script>
</body>
</html>
