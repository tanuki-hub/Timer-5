<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer-5</title>
  <link rel="icon" href="icon.png">
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    input {
      padding: 0.5em;
      font-size: 1.2em;
      background-color: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      border-radius: 5px;
      margin-bottom: 1em;
    }
    #display {
      font-size: 3em;
      margin: 0.5em;
    }
    .paused {
      color: #ffcc00;
    }
    button {
      margin: 0.5em;
      padding: 0.5em 1em;
      font-size: 1em;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .whiteout {
      background-color: white !important;
      color: black !important;
    }
  </style>
</head>
<body>
  <input type="text" id="timeInput" placeholder="時間を入力 (例: 0907)" />
  <div id="display"><span id="modeIcon"></span><span id="time">00:00</span></div>
  <div>
    <button onclick="startTimer()">開始</button>
    <button onclick="togglePause()">一時停止</button>
  </div>
  <script>
    let startTime, timerDuration, stopwatchStartTime;
    let timerRunning = false;
    let stopwatchRunning = false;
    let paused = false;
    let pauseStart = null;
    let pauseDuration = 0;
    let wakeLock = null;

    const timeInput = document.getElementById("timeInput");
    const display = document.getElementById("time");
    const modeIcon = document.getElementById("modeIcon");

    function parseTime(input) {
      let num = parseInt(input, 10);
      if (isNaN(num)) return 0;
      let minutes = 0, seconds = 0;
      if (num < 100) {
        seconds = num;
      } else if (num < 10000) {
        seconds = num % 100;
        minutes = Math.floor(num / 100);
      }
      return minutes * 60 * 1000 + seconds * 1000;
    }

    function updateDisplay(ms) {
      const totalSec = Math.floor(ms / 1000);
      const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const sec = String(totalSec % 60).padStart(2, '0');
      display.textContent = `${min}:${sec}`;
    }

    function startTimer() {
      timerDuration = parseTime(timeInput.value);
      if (timerDuration <= 0) return;
      startTime = Date.now();
      timerRunning = true;
      stopwatchRunning = false;
      paused = false;
      pauseDuration = 0;
      saveState();
      requestWakeLock();
    }

    function togglePause() {
      if (!timerRunning && !stopwatchRunning) return;
      paused = !paused;
      if (paused) {
        pauseStart = Date.now();
      } else {
        pauseDuration += Date.now() - pauseStart;
      }
      saveState();
    }

    function switchToStopwatch() {
      stopwatchStartTime = Date.now();
      stopwatchRunning = true;
      timerRunning = false;
      paused = false;
      pauseDuration = 0;
      saveState();
    }

    function tick() {
      const now = Date.now();
      let mode = '', elapsed;
      if (paused) {
        mode = '⏸️';
        if (timerRunning) {
          elapsed = pauseStart - startTime - pauseDuration;
          updateDisplay(Math.max(timerDuration - elapsed, 0));
        } else if (stopwatchRunning) {
          elapsed = pauseStart - stopwatchStartTime - pauseDuration;
          updateDisplay(elapsed);
        }
      } else if (timerRunning) {
        mode = '▼';
        elapsed = now - startTime - pauseDuration;
        let remaining = timerDuration - elapsed;
        if (remaining <= 0) {
          switchToStopwatch();
        } else {
          updateDisplay(remaining);
        }
      } else if (stopwatchRunning) {
        mode = '▲';
        elapsed = now - stopwatchStartTime - pauseDuration;
        updateDisplay(elapsed);
        if (elapsed >= 5 * 60 * 1000) {
          document.body.classList.add("whiteout");
        }
      }
      modeIcon.textContent = mode + ' ';
      requestAnimationFrame(tick);
    }

    function requestWakeLock() {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(lock => wakeLock = lock).catch(() => {});
      }
    }

    function saveState() {
      const state = {
        input: timeInput.value,
        startTime,
        timerDuration,
        stopwatchStartTime,
        timerRunning,
        stopwatchRunning,
        paused,
        pauseStart,
        pauseDuration
      };
      localStorage.setItem('timer5state', JSON.stringify(state));
    }

    function loadState() {
      const state = JSON.parse(localStorage.getItem('timer5state'));
      if (!state) return;
      ({
        startTime,
        timerDuration,
        stopwatchStartTime,
        timerRunning,
        stopwatchRunning,
        paused,
        pauseStart,
        pauseDuration
      } = state);
      timeInput.value = state.input;
      if (paused && pauseStart === null) pauseStart = Date.now();
    }

    window.addEventListener("keydown", e => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePause();
      }
    });

    loadState();
    tick();
  </script>
</body>
</html>
