<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer & Stopwatch</title>
  <link rel="icon" href="icon.png">
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
    }
    input {
      font-size: 2em;
      padding: 0.5em;
      background-color: #1e1e1e;
      color: white;
      border: 1px solid #555;
    }
    button {
      font-size: 1.2em;
      padding: 0.5em 1em;
      margin: 0.5em;
    }
    #timeDisplay {
      font-size: 4em;
      margin-top: 1em;
    }
    .arrow {
      margin-right: 0.3em;
    }
  </style>
</head>
<body>
  <h1>タイマー & ストップウォッチ</h1>
  <input type="text" id="timeInput" placeholder="0907 → 9分7秒">
  <div>
    <button id="startBtn">開始</button>
    <button id="pauseBtn">一時停止</button>
  </div>
  <div id="timeDisplay"><span id="statusIcon">▶</span><span id="arrow">↓</span>00:00</div>

  <script>
    let mode = "stopped"; // "timer", "stopwatch", "paused"
    let duration = 0; // in ms
    let endTime = null;
    let startTime = null;
    let pausedAt = null;
    let interval;
    let noSleep;

    // 端末のスリープを防ぐための処理
    document.addEventListener('click', () => {
      if (!noSleep && window.WakeLock) {
        navigator.wakeLock.request('screen').then(lock => {
          noSleep = lock;
        }).catch(() => {});
      }
    });

    function saveState() {
      const state = {
        mode,
        duration,
        endTime,
        startTime,
        pausedAt,
        inputValue: document.getElementById("timeInput").value
      };
      localStorage.setItem("timerState", JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem("timerState");
      if (!saved) return;
      const state = JSON.parse(saved);
      mode = state.mode;
      duration = state.duration;
      endTime = state.endTime;
      startTime = state.startTime;
      pausedAt = state.pausedAt;
      document.getElementById("timeInput").value = state.inputValue || "";

      if (mode === "timer") {
        if (pausedAt) {
          updateDisplay(pausedAt, true);
        } else {
          tick();
          interval = setInterval(tick, 250);
        }
      } else if (mode === "stopwatch") {
        if (pausedAt) {
          updateDisplay(pausedAt, false);
        } else {
          tick();
          interval = setInterval(tick, 250);
        }
      }
    }

    function parseTimeInput(input) {
      let n = parseInt(input);
      if (isNaN(n)) return 0;
      let seconds = n % 100;
      let minutes = Math.floor(n / 100);
      return (minutes * 60 + seconds) * 1000;
    }

    function startTimer() {
      clearInterval(interval);
      let input = document.getElementById("timeInput").value;
      duration = parseTimeInput(input);
      if (duration <= 0) return;
      endTime = Date.now() + duration;
      mode = "timer";
      pausedAt = null;
      tick();
      interval = setInterval(tick, 250);
      saveState();
    }

    function switchToStopwatch() {
      startTime = Date.now();
      mode = "stopwatch";
      pausedAt = null;
      tick();
      interval = setInterval(tick, 250);
      saveState();
    }

    function pause() {
      if (mode === "timer") {
        pausedAt = Math.max(0, endTime - Date.now());
      } else if (mode === "stopwatch") {
        pausedAt = Date.now() - startTime;
      }
      mode = "paused";
      clearInterval(interval);
      saveState();
    }

    function resume() {
      if (pausedAt == null) return;
      if (duration && pausedAt <= 0) return;
      if (mode === "paused") {
        if (endTime) {
          endTime = Date.now() + pausedAt;
          mode = "timer";
        } else if (startTime || pausedAt) {
          startTime = Date.now() - pausedAt;
          mode = "stopwatch";
        }
        pausedAt = null;
        tick();
        interval = setInterval(tick, 250);
        saveState();
      }
    }

    function tick() {
      let now = Date.now();
      let ms = 0;
      let isTimer = mode === "timer";
      if (isTimer) {
        ms = endTime - now;
        if (ms <= 0) {
          switchToStopwatch();
          return;
        }
      } else if (mode === "stopwatch") {
        ms = now - startTime;
        if (ms >= 5 * 60 * 1000) {
          document.body.style.backgroundColor = "white";
          document.body.style.color = "black";
        }
      }
      updateDisplay(ms, isTimer);
    }

    function updateDisplay(ms, isTimer) {
      const icon = (mode === "paused") ? "⏸" : "▶";
      const arrow = isTimer ? "↓" : "↑";
      const totalSeconds = Math.floor(ms / 1000);
      const min = Math.floor(totalSeconds / 60);
      const sec = totalSeconds % 60;
      document.getElementById("statusIcon").textContent = icon;
      document.getElementById("arrow").textContent = arrow;
      document.getElementById("timeDisplay").innerHTML = `<span id="statusIcon">${icon}</span><span id="arrow">${arrow}</span>${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      if (mode === "paused") {
        resume();
      } else {
        startTimer();
      }
    });

    document.getElementById("pauseBtn").addEventListener("click", pause);
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (mode === "paused") resume();
        else pause();
      }
    });

    loadState();
  </script>
</body>
</html>
