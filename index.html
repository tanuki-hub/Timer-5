<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="icon.png">
  <title>Timer-5</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      transition: background-color 0.5s;
    }

    input[type="text"] {
      font-size: 2rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      margin-bottom: 1rem;
      background-color: #333;
      color: white;
      text-align: center;
      width: 8rem;
    }

    #display {
      font-size: 4rem;
      margin: 1rem;
    }

    .status {
      font-size: 2rem;
      margin-top: 1rem;
    }

    button {
      font-size: 1.5rem;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</head>

<body>
  <input type="text" id="timeInput" placeholder="0907">
  <div id="display">00:00</div>
  <div class="status" id="statusMark">⏸️</div>
  <div>
    <button onclick="start()">スタート</button>
    <button onclick="togglePause()">一時停止</button>
  </div>

  <script>
    let startTime, pauseTime, paused = false, mode = 'timer', endTime;
    let stopwatchStartTime, stopwatchPausedTime;
    let interval;

    document.addEventListener("DOMContentLoaded", () => {
      const savedInput = localStorage.getItem("inputTime");
      const savedState = localStorage.getItem("timerState");
      const savedStart = localStorage.getItem("startTime");
      const savedMode = localStorage.getItem("mode");
      const savedPaused = localStorage.getItem("paused");
      const savedPauseTime = localStorage.getItem("pauseTime");

      if (savedInput) document.getElementById("timeInput").value = savedInput;

      if (savedState && savedStart) {
        mode = savedMode;
        paused = savedPaused === 'true';
        pauseTime = parseInt(savedPauseTime);
        startTime = parseInt(savedStart);

        if (!paused) startTimer();
        else updateDisplay();
      }
    });

    document.addEventListener("keydown", e => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePause();
      }
    });

    function start() {
      const input = document.getElementById("timeInput").value;
      if (!input) return;

      localStorage.setItem("inputTime", input);

      let seconds = parseInt(input);
      if (seconds < 100) {
        seconds = seconds;
      } else if (seconds < 10000) {
        seconds = Math.floor(seconds / 100) * 60 + (seconds % 100);
      } else return;

      startTime = Date.now();
      endTime = startTime + seconds * 1000;
      paused = false;
      mode = 'timer';
      localStorage.setItem("timerState", 'running');
      localStorage.setItem("startTime", startTime);
      localStorage.setItem("mode", mode);
      localStorage.setItem("paused", paused);
      localStorage.removeItem("pauseTime");
      startTimer();
    }

    function startTimer() {
      clearInterval(interval);
      interval = setInterval(updateDisplay, 100);
    }

    function togglePause() {
      if (!startTime) return;

      paused = !paused;
      localStorage.setItem("paused", paused);
      if (paused) {
        pauseTime = Date.now();
        localStorage.setItem("pauseTime", pauseTime);
        clearInterval(interval);
      } else {
        const pauseDuration = Date.now() - pauseTime;
        startTime += pauseDuration;
        if (mode === 'timer') endTime += pauseDuration;
        localStorage.setItem("startTime", startTime);
        startTimer();
      }
    }

    function updateDisplay() {
      const now = Date.now();
      let diff;

      if (paused) {
        if (mode === 'timer') {
          diff = Math.max(0, endTime - pauseTime);
        } else {
          diff = pauseTime - stopwatchStartTime;
        }
      } else {
        if (mode === 'timer') {
          diff = Math.max(0, endTime - now);
          if (diff <= 0) {
            mode = 'stopwatch';
            stopwatchStartTime = Date.now();
            localStorage.setItem("mode", mode);
          }
        } else {
          diff = now - stopwatchStartTime;
        }
      }

      const min = Math.floor(diff / 60000).toString().padStart(2, '0');
      const sec = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
      document.getElementById("display").textContent = `${min}:${sec}`;

      if (mode === 'timer') {
        document.getElementById("statusMark").textContent = paused ? "⏸️" : "▼";
      } else {
        document.getElementById("statusMark").textContent = paused ? "⏸️" : "▲";
        if (!paused && diff > 5 * 60 * 1000) document.body.style.backgroundColor = "#ffffff";
      }
    }

    if ('wakeLock' in navigator) {
      let wakeLock = null;
      const requestWakeLock = async () => {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) { }
      };
      requestWakeLock();
    }
  </script>
</body>

</html>
